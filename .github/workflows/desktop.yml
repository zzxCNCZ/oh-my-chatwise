name: macOS ARM64 build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify application and release versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Check frontend and release scripts
        run: |
          pnpm format:check
          pnpm test
          node --test scripts/check-release-version.node-test.mjs

      - name: Check Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build ARM64 application and DMG
        env:
          # Ad-hoc signing needs no certificate. It does not provide Apple notarization.
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --target aarch64-apple-darwin --bundles app,dmg -- --locked

      - name: Package application and checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root=src-tauri/target/aarch64-apple-darwin/release/bundle
          app="$bundle_root/macos/oh-my-chatwise.app"
          binary="$app/Contents/MacOS/oh-my-chatwise"
          test "$(lipo -archs "$binary")" = arm64
          codesign --verify --deep --strict "$app"
          mkdir -p release
          cp "$bundle_root/dmg/oh-my-chatwise_${APP_VERSION}_aarch64.dmg" \
            "release/oh-my-chatwise_${APP_VERSION}_macos_arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "release/oh-my-chatwise_${APP_VERSION}_macos_arm64.app.zip"
          cd release
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS.txt

      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-chatwise-macos-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: oh-my-chatwise-macos-arm64
          path: release

      - name: Verify downloaded packages
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          macOS Apple Silicon (ARM64 / M1 及更新机型) 安装包。

          - `.dmg`：打开后将应用拖入 Applications。
          - `.app.zip`：压缩的应用程序包。
          - `SHA256SUMS.txt`：下载文件的 SHA-256 校验值。

          当前使用 ad-hoc 签名，未进行 Apple Developer ID 签名和公证。
          macOS 首次打开可能需要在「系统设置 → 隐私与安全性」中允许打开。
          NOTES

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo 'Release already published; use a new version tag instead of replacing it.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "oh-my-chatwise $RELEASE_TAG" \
              --prerelease="$IS_PRERELEASE" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          latest=true
          if [ "$IS_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false \
            --prerelease="$IS_PRERELEASE" --latest="$latest"
